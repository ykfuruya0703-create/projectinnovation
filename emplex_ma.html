<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eMplex MA | マーケティングオートメーション ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#060c14;--bg1:#0a1628;--bg2:#0f2040;--bg3:#152850;
  --accent:#00d4ff;--accent2:#0090ff;--accent3:#00ff88;
  --gold:#f5c842;--gold2:#ffaa00;
  --teal:#00c8a0;--teal2:#00e8b8;
  --purple:#8b5cf6;--purple2:#a78bfa;
  --pink:#ec4899;--pink2:#f472b6;
  --red:#ef4444;--red2:#f87171;
  --green:#22c55e;--green2:#4ade80;
  --orange:#f97316;--orange2:#fb923c;
  --gray:#334155;--gray2:#64748b;--gray3:#94a3b8;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#475569;
  --border:rgba(0,212,255,0.12);--border2:rgba(0,212,255,0.25);
  --glow:0 0 20px rgba(0,212,255,0.15);
}
body{font-family:'Hiragino Sans','Yu Gothic UI',sans-serif;background:var(--bg0);color:var(--text);font-size:12px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(0,100,200,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(0,200,160,0.06) 0%,transparent 60%);pointer-events:none;z-index:0}

.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(6,12,20,0.95);border-bottom:1px solid var(--border2);display:flex;align-items:center;padding:0 20px;gap:0;z-index:200;backdrop-filter:blur(20px)}
.logo{display:flex;align-items:center;gap:10px;padding-right:20px;border-right:1px solid var(--border2);flex-shrink:0}
.logo-mark{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--teal));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#000;letter-spacing:-1px}
.logo-text{display:flex;flex-direction:column;line-height:1.2}
.logo-text b{font-size:13px;color:#fff;letter-spacing:1px}
.logo-text span{font-size:9px;color:var(--accent);letter-spacing:2px;text-transform:uppercase}
.nav-tabs{display:flex;height:100%;padding-left:8px;overflow-x:auto}
.nav-tab{padding:0 15px;height:100%;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;letter-spacing:.3px}
.nav-tab:hover{color:var(--text);background:rgba(0,212,255,0.05)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0;white-space:nowrap}
.live-badge{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--green);padding:3px 8px;border:1px solid rgba(34,197,94,0.3);border-radius:12px;background:rgba(34,197,94,0.08)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.date-badge{font-size:10px;color:var(--text2)}

.app{display:flex;flex-direction:column;min-height:100vh;padding-top:56px}
.content{display:none;flex:1}
.content.active{display:flex;flex-direction:column}
.scroll-main{flex:1;padding:18px 22px;max-width:1680px;width:100%;margin:0 auto}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);border-radius:3px}

.card{background:rgba(10,22,40,0.8);border:1px solid var(--border);border-radius:12px;padding:16px;backdrop-filter:blur(10px);position:relative;overflow:hidden;margin-bottom:14px}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.4}
.card-title{font-size:11px;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.card-title .t{display:flex;align-items:center;gap:6px}
.card-title .t::before{content:'';width:3px;height:11px;background:var(--accent);border-radius:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
@media(max-width:1200px){.grid2,.grid3,.grid4,.grid5{grid-template-columns:1fr 1fr}}

.kpi{background:rgba(10,22,40,0.9);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden;transition:.2s}
.kpi:hover{border-color:var(--border2);box-shadow:var(--glow)}
.kpi-accent{position:absolute;bottom:0;left:0;right:0;height:2px}
.kpi-label{font-size:10.5px;color:var(--text2);margin-bottom:8px;letter-spacing:.5px}
.kpi-val{font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1}
.kpi-sub{font-size:10.5px;margin-top:6px;color:var(--text2)}
.kpi-icon{position:absolute;top:14px;right:14px;font-size:22px;opacity:.15}

.dtbl{width:100%;border-collapse:collapse;font-size:11.5px}
.dtbl th{background:rgba(15,32,64,0.9);color:var(--text2);padding:8px 10px;text-align:left;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;letter-spacing:.3px;position:sticky;top:0}
.dtbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap}
.dtbl tr:hover td{background:rgba(0,212,255,0.04)}
.dtbl td.num,.dtbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-scroll{overflow-x:auto;max-height:560px;overflow-y:auto}

.badge-rank{display:inline-flex;align-items:center;justify-content:center;min-width:26px;padding:2px 8px;border-radius:6px;font-weight:800;font-size:12px}
.rank-S{background:rgba(245,200,66,0.18);color:var(--gold)}
.rank-A{background:rgba(0,200,160,0.18);color:var(--teal2)}
.rank-B{background:rgba(0,212,255,0.15);color:var(--accent)}
.rank-C{background:rgba(148,163,184,0.18);color:var(--text2)}

.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;border:1px solid var(--border2);color:var(--text2)}
.pill.acc{color:var(--accent);border-color:rgba(0,212,255,0.4);background:rgba(0,212,255,0.08)}
.pill.gold{color:var(--gold);border-color:rgba(245,200,66,0.4);background:rgba(245,200,66,0.08)}
.pill.teal{color:var(--teal2);border-color:rgba(0,200,160,0.4);background:rgba(0,200,160,0.08)}
.pill.red{color:var(--red2);border-color:rgba(239,68,68,0.4);background:rgba(239,68,68,0.08)}
.pill.purple{color:var(--purple2);border-color:rgba(139,92,246,0.4);background:rgba(139,92,246,0.08)}
.pill.gray{color:var(--gray3);border-color:rgba(148,163,184,0.3);background:rgba(148,163,184,0.06)}

.progress-bar{height:6px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden;position:relative;display:flex}
.progress-bar i{display:block;height:100%}
.progress-bar i.single{border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--teal))}

.subhead{font-size:11px;color:var(--accent);font-weight:700;margin:14px 0 6px;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.subhead::before{content:'▸'}
.text-block{font-size:12px;line-height:1.9;color:var(--text);white-space:pre-wrap;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:8px;padding:12px 14px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.two-col{grid-template-columns:1fr}}

.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.form-row input,.form-row select,.form-row textarea{background:rgba(255,255,255,0.04);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:6px 10px;font-size:11.5px;font-family:inherit}
.form-row textarea{width:100%;min-height:50px;resize:vertical}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#001a26;border:none;border-radius:6px;padding:7px 16px;font-size:11.5px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--border2)}
.btn.danger{background:rgba(239,68,68,0.15);color:var(--red2);border:1px solid rgba(239,68,68,0.4)}
.btn.xs{padding:4px 10px;font-size:10.5px;border-radius:5px}

.toggle{position:relative;width:38px;height:20px;border-radius:10px;background:rgba(255,255,255,0.1);cursor:pointer;flex-shrink:0;transition:.2s;border:1px solid var(--border2)}
.toggle.on{background:rgba(34,197,94,0.35);border-color:rgba(34,197,94,0.6)}
.toggle i{position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on i{transform:translateX(18px);background:#22c55e}

.score-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,0.06);width:100%}
.score-bar .attr{background:linear-gradient(90deg,#0090ff,#00d4ff)}
.score-bar .beh{background:linear-gradient(90deg,#00c8a0,#00e8b8)}

.seg-card{background:rgba(10,22,40,0.9);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;transition:.15s}
.seg-card:hover{border-color:var(--border2)}
.seg-name{font-size:13px;font-weight:700;color:#fff;margin-bottom:4px}
.seg-cond{font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:8px}
.seg-count{font-size:20px;font-weight:800;color:var(--accent)}
.seg-meta{font-size:10px;color:var(--text3)}

.scenario-card{background:rgba(10,22,40,0.9);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.scenario-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.scenario-title{font-size:13.5px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}
.scenario-flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 0}
.sf-node{background:rgba(15,32,64,0.7);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;min-width:150px;flex-shrink:0}
.sf-node .sf-tag{font-size:8.5px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.sf-node .sf-body{font-size:11px;color:var(--text);line-height:1.5}
.sf-arrow{display:flex;align-items:center;justify-content:center;padding:0 8px;color:var(--accent);font-size:16px;flex-shrink:0}
.scenario-stats{display:flex;gap:20px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.scenario-stat{display:flex;flex-direction:column;gap:2px}
.scenario-stat b{font-size:15px;color:#fff}
.scenario-stat span{font-size:9.5px;color:var(--text3)}

.funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.funnel-bar-wrap{flex:1;background:rgba(255,255,255,0.05);border-radius:6px;height:30px;position:relative;overflow:hidden}
.funnel-bar{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));display:flex;align-items:center;padding-left:10px;font-size:11px;font-weight:700;color:#001a26;white-space:nowrap}
.funnel-label{width:150px;font-size:11px;color:var(--text2);flex-shrink:0}
.funnel-val{width:110px;text-align:right;font-size:11.5px;font-weight:700;color:#fff;flex-shrink:0}

.tier-pill{display:inline-flex;align-items:center;justify-content:center;padding:3px 10px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:.3px}
.signal-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:3px 9px;border-radius:12px;margin:2px 4px 2px 0;border:1px solid}
.golden-box{background:linear-gradient(135deg,rgba(245,158,11,0.08),rgba(239,68,68,0.06));border:1px solid rgba(245,158,11,0.3);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.p0-card{background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.35);border-radius:10px;padding:14px;margin-bottom:10px}
.p0-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ai-draft{white-space:pre-wrap;font-size:11px;line-height:1.8;background:rgba(0,0,0,0.25);border:1px solid var(--border2);border-radius:8px;padding:12px 14px;color:var(--text2);margin-top:8px;display:none}
.ai-draft.show{display:block}
.roi-compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.roi-box{border-radius:12px;padding:20px;text-align:center}
.pager{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--text2)}
.pager button{background:rgba(255,255,255,0.06);border:1px solid var(--border2);color:var(--text);border-radius:5px;padding:4px 10px;cursor:pointer;font-size:11px}
.pager button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-mark">e</div>

</div>

<script>
/* ============ UTIL ============ */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtNum(n){ return n.toLocaleString('ja-JP'); }
function fmtPct(n){ return (Math.round(n*10)/10)+'%'; }
let seedState = 88172645;
function rnd(){ seedState ^= seedState << 13; seedState ^= seedState >>> 17; seedState ^= seedState << 5; seedState |= 0; return ((seedState < 0 ? ~seedState + 1 : seedState) % 100000) / 100000; }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function pickWeighted(pairs){ const total = pairs.reduce((s,p)=>s+p[1],0); let r = rnd()*total; for (const [v,w] of pairs){ if (r < w) return v; r -= w; } return pairs[0][0]; }
const charts = {};
function destroyChart(id){ if (charts[id]){ charts[id].destroy(); delete charts[id]; } }

function makeCompanyName(i){

function genSyntheticCompanies(n){

/* ---- Scoring engine ---- */
function attributeScore(c){
  let s = 0;
  if (['不動産取引業','不動産賃貸業・管理業','総合工事業'].includes(c.industry)) s += 20;
  else if (c.industry==='情報サービス業') s += 14;
  else s += 8;
  const capIdx = CAP_ORDER[c.capital];
  s += Math.min(20, capIdx*4);
  if (c.listed) s += 10;
  if (c.employees >= 300) s += 8; else if (c.employees >= 50) s += 4;
  return Math.min(50, s);
}
function behaviorScore(st){
  let s = 0;
  s += Math.min(20, st.visits*4);
  s += Math.min(15, st.pages*1.5);
  const avgDur = st.duration/st.visits;
  if (avgDur >= 180) s += 10; else if (avgDur >= 90) s += 6; else s += 2;
  if (st.landings.has('採用情報')) s += 6;
  if (st.landings.has('料金ページ')) s += 8;
  if (st.landings.has('資料ダウンロード')) s += 10;
  return Math.min(50, Math.round(s));
}
function rankOf(total){ return total>=80?'S': total>=60?'A': total>=40?'B':'C'; }
const LEADS = COMPANY_STATS.map(st=>{
  const attr = attributeScore(st.company);
  const beh = behaviorScore(st);
  const total = attr+beh;
  return { ...st, attr, beh, total, rank: rankOf(total) };
}).sort((a,b)=> b.total - a.total);

];
LEADS.forEach(l=>{
  const emotionBase = 28 + Math.round(rnd()*48);
  const emotionSpike = rnd() < 0.24;
  l.emotionScore = Math.min(100, emotionBase + (emotionSpike ? 18+Math.round(rnd()*17) : 0));
  l.emotionBase = emotionBase;
  l.emotionSpike = emotionSpike;
  l.fiscalDaysToEnd = 5 + Math.floor(rnd()*360);
  l.fiscalNear = l.fiscalDaysToEnd <= 90;
  l.snsSignal = rnd() < 0.24;
  l.snsPost = l.snsSignal ? pick(SNS_POST_SAMPLES) : null;
  l.snsDt = l.snsSignal ? randomPastDate(14) : null;

  const sigs = [];
  if (l.snsSignal) sigs.push({ type:'sns', dt:l.snsDt, detail:l.snsPost });
  if (l.fiscalNear) sigs.push({ type:'fiscal', dt:TODAY, detail:`決算まで残り${l.fiscalDaysToEnd}日` });
  if (l.emotionSpike) sigs.push({ type:'emotion', dt:randomPastDate(10), detail:`感情スコアが${emotionBase}→${l.emotionScore}に急上昇` });

  const grossProfit = Math.round(dealAmount * grossMarginPct/100);
  return { lead:l, scenario, dealAmount, grossMarginPct, grossProfit, excluded: grossMarginPct < 15, wonDate: randomPastDate(150) };
});
function scenarioROI(){
  const map = new Map();

    m.count++; m.revenue += o.dealAmount;
    if (o.excluded) m.excludedCount++; else m.profit += o.grossProfit;

function renderVisitorTable(){
  let rows = VISITS;
  if (VFILTER.industry) rows = rows.filter(v=>v.company.industry===VFILTER.industry);

  if (VFILTER.referrer) rows = rows.filter(v=>v.referrer===VFILTER.referrer);
  if (VFILTER.keyword) rows = rows.filter(v=>v.company.name.includes(VFILTER.keyword));

  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total/V_PAGE_SIZE));

let segRows = [ { type:'industry', val: INDUSTRIES[0] }, { type:'visitsMin', val: 2 } ];
const SEG_TYPE_LABEL = { industry:'業種 =', capitalMin:'資本金 ≥', employeesMin:'従業員数 ≥', listed:'上場区分 =', visitsMin:'訪問回数 ≥', landing:'閲覧ページ含む =' };
function segRowEvaluator(row){
  return (l)=>{
    if (row.type==='industry') return l.company.industry === row.val;
    if (row.type==='capitalMin') return CAP_ORDER[l.company.capital] >= CAP_ORDER[row.val];
    if (row.type==='employeesMin') return l.company.employees >= Number(row.val);
    if (row.type==='listed') return row.val==='上場' ? l.company.listed : !l.company.listed;
    if (row.type==='visitsMin') return l.visits >= Number(row.val);
    if (row.type==='landing') return l.landings.has(row.val);
    return true;
  };
}
function segBuilderMatchCount(){
  const evals = segRows.map(segRowEvaluator);
  return LEADS.filter(l=> evals.every(fn=>fn(l))).length;
}
function segRowValueInput(row, idx){
  if (row.type==='industry') return `<select onchange="segRowUpdate(${idx},this.value)">${INDUSTRIES.map(i=>`<option ${i===row.val?'selected':''}>${i}</option>`).join('')}</select>`;
  if (row.type==='capitalMin') return `<select onchange="segRowUpdate(${idx},this.value)">${CAPITAL_RANGES.map(c=>`<option ${c===row.val?'selected':''}>${c}</option>`).join('')}</select>`;
  if (row.type==='employeesMin') return `<input type="number" style="width:90px" value="${row.val}" oninput="segRowUpdate(${idx},this.value)">`;
  if (row.type==='listed') return `<select onchange="segRowUpdate(${idx},this.value)"><option ${row.val==='上場'?'selected':''}>上場</option><option ${row.val==='未上場'?'selected':''}>未上場</option></select>`;
  if (row.type==='visitsMin') return `<input type="number" style="width:90px" value="${row.val}" oninput="segRowUpdate(${idx},this.value)">`;
  if (row.type==='landing') return `<select onchange="segRowUpdate(${idx},this.value)">${PAGES.map(p=>`<option ${p===row.val?'selected':''}>${p}</option>`).join('')}</select>`;
  return '';
}
function segRowUpdate(idx,val){ segRows[idx].val = val; renderSegBuilder(); }
function segRowTypeChange(idx, type){
  const defaults = { industry:INDUSTRIES[0], capitalMin:CAPITAL_RANGES[0], employeesMin:50, listed:'上場', visitsMin:2, landing:PAGES[0] };
  segRows[idx] = { type, val: defaults[type] };
  renderSegBuilder();
}
function segAddRow(){ segRows.push({ type:'visitsMin', val:1 }); renderSegBuilder(); }
function segRemoveRow(idx){ segRows.splice(idx,1); renderSegBuilder(); }
function segSave(){
  const nameInput = document.getElementById('segNameInput');
  const name = (nameInput.value||'').trim();
  if (!name){ nameInput.focus(); return; }
  const evals = segRows.map(segRowEvaluator);
  const match = LEADS.filter(l=> evals.every(fn=>fn(l)));
  const cond = segRows.map(r=> `${SEG_TYPE_LABEL[r.type]}${r.val}`).join('　AND　');
  SEGMENTS.unshift({ name, cond, match, custom:true });
  nameInput.value = '';
  renderSegments();
}
function segDelete(idx){ SEGMENTS.splice(idx,1); renderSegments(); }

          <div class="sf-node" style="border-color:#ec489955"><div class="sf-tag" style="color:#ec4899">5</div><div class="sf-body">高粗利シナリオへ配信比率を自動シフト</div></div>
        </div>
        <p style="font-size:11px;color:var(--text2);line-height:1.8;margin-top:10px">現在最も平均粗利率が高いのは <b style="color:#fff">「${esc(bestMargin.scenario)}」経由（粗利率${bestMargin.marginPct}%）</b>。「PBM粗利連動 配信最適化」シナリオが毎月この学習結果をもとに配信比率を自動調整します。</p>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="t">シナリオ別 ROI明細</span><span class="pill teal">粗利率が高い順に配信比率を自動シフト</span></div>
      <table class="dtbl">
        <tr><th>経由シナリオ</th><th class="num">受注件数</th><th class="num">受注金額</th><th class="num">PBM確定粗利</th><th class="num">粗利率</th><th class="num">除外件数（原価超過）</th></tr>
        ${SCENARIO_ROI.slice().sort((a,b)=>b.marginPct-a.marginPct).map(m=>`
        <tr>
          <td>${esc(m.scenario)}</td>
          <td class="num">${m.count}件</td>
          <td class="num">${fmtNum(Math.round(m.revenue/10000))}万円</td>
          <td class="num" style="color:var(--teal2);font-weight:700">${fmtNum(Math.round(m.profit/10000))}万円</td>
          <td class="num" style="font-weight:800">${m.marginPct}%</td>
          <td class="num">${m.excludedCount>0?`<span class="pill red">${m.excludedCount}件</span>`:'—'}</td>
        </tr>`).join('')}
      </table>
    </div>
  `;
  destroyChart('chROI');
  const sorted = SCENARIO_ROI.slice().sort((a,b)=>b.profit-a.profit);
  charts.chROI = new Chart(document.getElementById('chROI'), {
    type:'bar',
    data:{
      labels: sorted.map(m=>m.scenario),
      datasets:[
        { label:'受注件数', data: sorted.map(m=>m.count), backgroundColor:'rgba(0,212,255,0.55)', borderRadius:4, yAxisID:'y' },
        { label:'確定粗利（万円）', data: sorted.map(m=>Math.round(m.profit/10000)), backgroundColor:'rgba(34,197,94,0.6)', borderRadius:4, yAxisID:'y1' },
      ]
    },
    options:{
      plugins:{legend:{labels:{color:'#94a3b8',font:{size:10}}}},
      scales:{
        x:{ticks:{color:'#94a3b8',font:{size:9}},grid:{display:false}},
        y:{position:'left',ticks:{color:'#94a3b8',font:{size:9.5}},grid:{color:'rgba(255,255,255,0.05)'}},
        y1:{position:'right',ticks:{color:'#94a3b8',font:{size:9.5}},grid:{display:false}},
      }
    }
  });
}

function renderCampaigns(){
  const sentCampaigns = CAMPAIGNS.filter(c=>c.status==='配信済み');
  const totalSent = sentCampaigns.reduce((s,c)=>s+c.sent,0);
  const avgOpen = (sentCampaigns.reduce((s,c)=>s+c.open,0)/sentCampaigns.length).toFixed(1);
  const avgClick = (sentCampaigns.reduce((s,c)=>s+c.click,0)/sentCampaigns.length).toFixed(1);
  const totalCv = sentCampaigns.reduce((s,c)=>s+c.cv,0);
  document.getElementById('pane-campaigns').innerHTML = `
    <div class="grid4">
      <div class="kpi"><div class="kpi-label">累計配信数</div><div class="kpi-val" style="color:#00d4ff">${fmtNum(totalSent)}件</div><div class="kpi-sub">配信済み${sentCampaigns.length}キャンペーン</div><div class="kpi-accent" style="background:#00d4ff"></div></div>
      <div class="kpi"><div class="kpi-label">平均開封率</div><div class="kpi-val" style="color:#00e8b8">${avgOpen}%</div><div class="kpi-sub">業界平均比 +8.2pt</div><div class="kpi-accent" style="background:#00e8b8"></div></div>
      <div class="kpi"><div class="kpi-label">平均クリック率</div><div class="kpi-val" style="color:#fbbf24">${avgClick}%</div><div class="kpi-sub">セグメント配信の効果</div><div class="kpi-accent" style="background:#f5c842"></div></div>
      <div class="kpi"><div class="kpi-label">CV貢献数</div><div class="kpi-val" style="color:#a78bfa">${totalCv}件</div><div class="kpi-sub">商談・資料請求換算</div><div class="kpi-accent" style="background:#8b5cf6"></div></div>
    </div>

    <div class="card">
      <div class="card-title"><span class="t">キャンペーン別 開封率・クリック率</span></div>
      <canvas id="chCampaign" height="80"></canvas>
    </div>

    <div class="card">
      <div class="card-title"><span class="t">配信キャンペーン一覧</span><span class="pill">${CAMPAIGNS.length}件</span></div>
      <div class="tbl-scroll">
      <table class="dtbl">
        <tr><th>配信日</th><th>キャンペーン名</th><th>対象セグメント</th><th class="num">配信数</th><th class="num">開封率</th><th class="num">クリック率</th><th class="num">CV数</th><th>ステータス</th></tr>
        ${CAMPAIGNS.map(c=>`
        <tr>
          <td>${c.date}</td>
          <td>${esc(c.name)}</td>
          <td>${esc(c.segment)}</td>
          <td class="num">${fmtNum(c.sent)}</td>
          <td class="num">${c.sent? fmtPct(c.open) : '—'}</td>
          <td class="num">${c.sent? fmtPct(c.click) : '—'}</td>
          <td class="num">${c.cv||'—'}</td>
          <td><span class="pill ${c.status==='配信済み'?'teal':'gold'}">${c.status}</span></td>
        </tr>`).join('')}
      </table>
      </div>
    </div>

    <div class="card" style="text-align:center;padding:26px">
      <button class="btn" onclick="alert('新規キャンペーン作成画面を開きます（デモ）')">＋ 新規キャンペーンを作成</button>
    </div>
  `;
  destroyChart('chCampaign');
  charts.chCampaign = new Chart(document.getElementById('chCampaign'), {
    type:'bar',
    data:{
      labels: CAMPAIGNS.map(c=>c.name),
      datasets:[
        { label:'開封率(%)', data: CAMPAIGNS.map(c=>c.open), backgroundColor:'rgba(0,212,255,0.6)', borderRadius:4 },
        { label:'クリック率(%)', data: CAMPAIGNS.map(c=>c.click), backgroundColor:'rgba(0,232,184,0.6)', borderRadius:4 },
      ]
    },
    options:{ plugins:{legend:{labels:{color:'#94a3b8',font:{size:10}}}}, scales:{ x:{ticks:{color:'#94a3b8',font:{size:9}},grid:{display:false}}, y:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'rgba(255,255,255,0.05)'}} } }
  });
}

const SETTINGS_STATE = { slack:true, teams:false, crm:true, scoreThreshold:80 };
function settingsToggle(key){ SETTINGS_STATE[key] = !SETTINGS_STATE[key]; renderForms(); }
function renderForms(){
  const maxFunnel = FUNNEL[0].val;
  document.getElementById('pane-forms').innerHTML = `
    <div class="card">
      <div class="card-title"><span class="t">コンバージョンファネル（訪問 → フォーム送信）</span></div>
      ${FUNNEL.map((f,i)=>{
        const pct = Math.round(f.val/maxFunnel*100);
        const dropText = i>0 ? `<span style="color:var(--red2)">前段より ${fmtPct(100-Math.round(f.val/FUNNEL[i-1].val*100))} 離脱</span>` : '';
        return `<div class="funnel-row">
          <div class="funnel-label">${f.label}</div>
          <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${pct}%">${pct}%</div></div>
          <div class="funnel-val">${fmtNum(f.val)}社</div>
        </div>
        ${dropText?`<div style="margin:-4px 0 8px 162px;font-size:10px">${dropText}</div>`:''}`;
      }).join('')}
    </div>

    <div class="card">
      <div class="card-title"><span class="t">LP・フォーム別 CVR</span></div>
      <table class="dtbl">
        <tr><th>LP / フォーム名</th><th class="num">訪問数</th><th class="num">CV数</th><th class="num">CVR</th></tr>
        ${LP_STATS.map(l=>`
        <tr>
          <td>${esc(l.name)}</td>
          <td class="num">${fmtNum(l.visits)}</td>
          <td class="num">${l.cv}</td>
          <td class="num" style="font-weight:800;color:var(--teal2)">${fmtPct(l.cvr)}</td>
        </tr>`).join('')}
      </table>
    </div>

    <div class="two-col">
      <div class="card">
        <div class="card-title"><span class="t">通知・連携設定</span></div>
        <div class="form-row" style="justify-content:space-between">
          <div><b style="font-size:12.5px">Slack通知</b><div style="font-size:10.5px;color:var(--text3)">Sランク到達時に #sales-hotlead へ通知</div></div>
          <div class="toggle ${SETTINGS_STATE.slack?'on':''}" onclick="settingsToggle('slack')"><i></i></div>
        </div>
        <div class="form-row" style="justify-content:space-between">
          <div><b style="font-size:12.5px">Microsoft Teams通知</b><div style="font-size:10.5px;color:var(--text3)">営業チームチャネルへの自動通知</div></div>
          <div class="toggle ${SETTINGS_STATE.teams?'on':''}" onclick="settingsToggle('teams')"><i></i></div>
        </div>
        <div class="form-row" style="justify-content:space-between">
          <div><b style="font-size:12.5px">CRM連携（Salesforce）</b><div style="font-size:10.5px;color:var(--text3)">Sランク到達で商談レコードを自動作成</div></div>
          <div class="toggle ${SETTINGS_STATE.crm?'on':''}" onclick="settingsToggle('crm')"><i></i></div>
        </div>
        <div class="subhead">アラートしきい値</div>
        <div class="form-row">
          <span style="font-size:11.5px;color:var(--text2)">スコアが</span>
          <input type="number" value="${SETTINGS_STATE.scoreThreshold}" style="width:70px" oninput="SETTINGS_STATE.scoreThreshold=this.value">
          <span style="font-size:11.5px;color:var(--text2)">pt 以上で営業へ即時通知</span>
          <button class="btn xs" onclick="alert('しきい値を'+SETTINGS_STATE.scoreThreshold+'ptに更新しました（デモ）')">保存</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title"><span class="t">サイト設置タグ</span></div>
        <p style="font-size:11.5px;color:var(--text2);line-height:1.8;margin-bottom:10px">計測したいサイトの &lt;/body&gt; 直前に以下のタグを設置してください。設置後、最短当日から企業訪問の識別が始まります。</p>
        <div class="text-block" style="font-family:'SF Mono',Consolas,monospace;font-size:10.5px;color:#00e8b8">&lt;script src="https://cdn.emplex-ma.jp/tag/v1/emplex-ma.js"&gt;&lt;/script&gt;
&lt;script&gt;EmplexMA.init({ siteId: "ema_8f2c91a0" });&lt;/script&gt;</div>
        <div class="form-row" style="margin-top:12px">
          <button class="btn sec xs" onclick="alert('タグをコピーしました（デモ）')">📋 タグをコピー</button>
          <span class="pill teal">最終計測：${fmtDT(VISITS[0].dt)}</span>
        </div>
      </div>
    </div>
  `;
}

renderDashboard();
</script>
</body>
</html>
