<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontier CRM — Private Wealth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  /* Navy palette */
  --n1: #03080f;
  --n2: #060e1a;
  --n3: #0a1628;
  --n4: #0f1e38;
  --n5: #162745;
  --n6: #1e3358;
  --n7: #253f6b;
  --n8: #2d4c7e;

  /* Gold palette */
  --g1: #7a5a1a;
  --g2: #a07822;
  --g3: #c49a2c;
  --g4: #d4aa3a;
  --g5: #e2bc52;
  --g6: #eeca6e;
  --g7: #f5d98a;
  --g8: #faeab0;

  /* Text */
  --t1: #f0eadb;
  --t2: #b8a98a;
  --t3: #7a6e58;
  --t4: #4a4236;

  /* Status */
  --s-green: #2a9d6e;
  --s-green-bg: rgba(42,157,110,.12);
  --s-red: #d45a4a;
  --s-red-bg: rgba(212,90,74,.12);
  --s-amber: #c8922a;
  --s-amber-bg: rgba(200,146,42,.12);
  --s-blue: #3a7abd;
  --s-blue-bg: rgba(58,122,189,.12);

  /* Borders */
  --b1: rgba(212,170,58,.08);
  --b2: rgba(212,170,58,.16);
  --b3: rgba(212,170,58,.28);
  --b4: rgba(212,170,58,.45);

  /* Surfaces */
  --card: rgba(15,30,56,.7);
  --card2: rgba(22,39,69,.8);
  --glass: rgba(255,255,255,.03);

  --radius: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --font: 'Outfit', sans-serif;
  --serif: 'Cormorant Garamond', serif;
  --mono: 'DM Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100vh; overflow: hidden; }

body {
  font-family: var(--font);
  background: var(--n1);
  color: var(--t1);
  font-size: 13px;
  display: flex;
  position: relative;
}

/* Background texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(212,170,58,.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 85% 100%, rgba(10,22,40,.8) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 210px;
  min-width: 210px;
  height: 100vh;
  background: var(--n2);
  border-right: 1px solid var(--b1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  z-index: 10;
}

#sidebar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 200px;
  background: linear-gradient(180deg, rgba(212,170,58,.04) 0%, transparent 100%);
  pointer-events: none;
}

.sb-header {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--b1);
  position: relative;
}

.sb-logo-mark {
  font-family: var(--serif);
  font-size: 11px;
  font-weight: 600;
  color: var(--g5);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 3px;
}

.sb-logo-name {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  color: var(--t1);
  line-height: 1;
  letter-spacing: .5px;
}

.sb-logo-sub {
  font-size: 10px;
  color: var(--t3);
  margin-top: 4px;
  letter-spacing: .5px;
}

.gold-rule {
  height: 1px;
  background: linear-gradient(90deg, var(--g5), transparent);
  margin: 10px 0 0;
}

#sb-nav {
  flex: 1;
  overflow-y: auto;
  padding: 10px 0;
}
#sb-nav::-webkit-scrollbar { width: 0; }

.sb-section {
  font-size: 9px;
  font-weight: 600;
  color: var(--t3);
  letter-spacing: 1.8px;
  text-transform: uppercase;
  padding: 14px 16px 5px;
}

.sb-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 16px;
  cursor: pointer;
  font-size: 12.5px;
  color: var(--t3);
  border-left: 2px solid transparent;
  transition: all .2s;
  position: relative;
}

.sb-item:hover {
  color: var(--t2);
  background: rgba(212,170,58,.03);
}

.sb-item.active {
  color: var(--g6);
  background: rgba(212,170,58,.06);
  border-left-color: var(--g5);
}

.sb-item .ico {
  width: 14px; height: 14px;
  flex-shrink: 0;
  opacity: .6;
}
.sb-item.active .ico { opacity: 1; }

.sb-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-top: 1px solid var(--b1);
  flex-shrink: 0;
}

.sb-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--g3), var(--g6));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--n2);
  flex-shrink: 0;
  box-shadow: 0 0 0 2px rgba(212,170,58,.2);
}

.sb-uname { font-size: 12px; color: var(--t2); font-weight: 500; }
.sb-urole { font-size: 10px; color: var(--t3); }

/* ── MAIN ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  min-width: 0;
  position: relative;
  z-index: 5;
}

/* TOPBAR */
#topbar {
  height: 52px;
  background: rgba(6,14,26,.95);
  border-bottom: 1px solid var(--b1);
  display: flex;
  align-items: center;
  padding: 0 22px;
  gap: 14px;
  flex-shrink: 0;
  backdrop-filter: blur(10px);
}

.tb-title {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 600;
  color: var(--t1);
  letter-spacing: .3px;
}

.tb-spacer { flex: 1; }

.tb-search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--b2);
  border-radius: var(--radius);
  padding: 7px 12px;
  width: 200px;
  transition: .2s;
}
.tb-search:focus-within {
  border-color: var(--b4);
  background: rgba(212,170,58,.04);
}
.tb-search input {
  border: none;
  background: transparent;
  font-size: 12px;
  color: var(--t1);
  font-family: var(--font);
  width: 100%;
  outline: none;
}
.tb-search input::placeholder { color: var(--t3); }

.btn-gold {
  height: 32px;
  padding: 0 16px;
  border-radius: var(--radius);
  border: 1px solid var(--g4);
  background: linear-gradient(135deg, rgba(196,154,44,.2), rgba(212,170,58,.1));
  color: var(--g6);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: .2s;
  letter-spacing: .3px;
}
.btn-gold:hover {
  background: linear-gradient(135deg, rgba(196,154,44,.35), rgba(212,170,58,.2));
  box-shadow: 0 0 12px rgba(212,170,58,.15);
}

.btn-ghost {
  height: 32px;
  padding: 0 14px;
  border-radius: var(--radius);
  border: 1px solid var(--b2);
  background: transparent;
  color: var(--t3);
  font-family: var(--font);
  font-size: 12px;
  cursor: pointer;
  transition: .2s;
}
.btn-ghost:hover { border-color: var(--b3); color: var(--t2); }

/* CONTENT */
#content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}
#content::-webkit-scrollbar { width: 4px; }
#content::-webkit-scrollbar-thumb {
  background: var(--b3);
  border-radius: 2px;
}

/* ── CARDS ── */
.card {
  background: var(--card);
  border: 1px solid var(--b1);
  border-radius: var(--radius-lg);
  overflow: hidden;
  backdrop-filter: blur(10px);
}

.card-body { padding: 16px 20px; }

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--b1);
}

.card-title {
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 600;
  color: var(--t1);
  margin-bottom: 14px;
  letter-spacing: .3px;
}

.card-title-sm {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 600;
  color: var(--t1);
  margin: 0;
  letter-spacing: .3px;
}

/* ── GRIDS ── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.g4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }

/* ── METRIC CARDS ── */
.metric {
  background: rgba(15,30,56,.6);
  border: 1px solid var(--b1);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  position: relative;
  overflow: hidden;
  transition: .2s;
}
.metric::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--g3), transparent);
}
.metric:hover { border-color: var(--b2); }
.metric-label {
  font-size: 10px;
  color: var(--t3);
  font-weight: 500;
  letter-spacing: .8px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.metric-value {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 600;
  color: var(--t1);
  line-height: 1;
}
.metric-unit { font-size: 14px; color: var(--t3); font-family: var(--font); }
.metric-sub { font-size: 10.5px; color: var(--t3); margin-top: 5px; }
.metric-up { color: var(--s-green); }
.metric-down { color: var(--s-red); }
.metric-gold { color: var(--g5); }

/* ── TABLES ── */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  font-size: 9.5px;
  font-weight: 600;
  color: var(--t3);
  text-align: left;
  padding: 9px 14px;
  background: rgba(255,255,255,.02);
  border-bottom: 1px solid var(--b1);
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: .8px;
}
.tbl td {
  padding: 11px 14px;
  border-bottom: 1px solid rgba(212,170,58,.05);
  color: var(--t1);
  vertical-align: middle;
  font-size: 12.5px;
}
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td {
  background: rgba(212,170,58,.03);
}
.tbl .name { font-weight: 500; color: var(--t1); }
.tbl .sub { font-size: 10.5px; color: var(--t3); margin-top: 1px; }

/* ── BADGES ── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  white-space: nowrap;
  letter-spacing: .3px;
}
.b-vip {
  background: rgba(212,170,58,.15);
  color: var(--g6);
  border: 1px solid rgba(212,170,58,.3);
}
.b-gold { background: rgba(200,146,42,.12); color: #e8a840; border: 1px solid rgba(200,146,42,.25); }
.b-plat { background: rgba(58,122,189,.12); color: #7ab3e0; border: 1px solid rgba(58,122,189,.25); }
.b-silver { background: rgba(120,120,130,.1); color: #9099a8; border: 1px solid rgba(120,120,130,.2); }
.b-std { background: rgba(42,157,110,.1); color: #5cc49a; border: 1px solid rgba(42,157,110,.2); }
.b-green { background: var(--s-green-bg); color: #5cc49a; border: 1px solid rgba(42,157,110,.2); }
.b-amber { background: var(--s-amber-bg); color: #e8a840; border: 1px solid rgba(200,146,42,.25); }
.b-red { background: var(--s-red-bg); color: #e87a6a; border: 1px solid rgba(212,90,74,.25); }
.b-blue { background: var(--s-blue-bg); color: #7ab3e0; border: 1px solid rgba(58,122,189,.25); }
.b-gray { background: rgba(255,255,255,.05); color: var(--t2); border: 1px solid var(--b1); }

/* ── PBAR ── */
.pbar {
  height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,.06);
  overflow: hidden;
  flex: 1;
}
.pfill { height: 100%; border-radius: 2px; }

/* ── GOLD DOT ── */
.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

/* ── TIMELINE ── */
.tl-item {
  display: flex;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(212,170,58,.05);
}
.tl-item:last-child { border-bottom: none; }
.tl-dot-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  padding-top: 4px;
}
.tl-dot2 { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tl-line { flex: 1; width: 1px; background: var(--b1); margin-top: 4px; }
.tl-content { flex: 1; }
.tl-hdr { display: flex; justify-content: space-between; margin-bottom: 4px; }
.tl-title { font-size: 12.5px; font-weight: 500; color: var(--t1); }
.tl-date { font-size: 10.5px; color: var(--t3); }
.tl-body { font-size: 11.5px; color: var(--t2); line-height: 1.5; }

/* ── KV ROWS ── */
.kv { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(212,170,58,.06); }
.kv:last-child { border-bottom: none; }
.kk { font-size: 11.5px; color: var(--t3); }
.kvv { font-size: 12.5px; font-weight: 500; color: var(--t1); }

/* ── LTV BANNER ── */
.ltv-banner {
  background: linear-gradient(135deg, #0a1628 0%, #0f1e38 40%, #07100a 100%);
  border: 1px solid var(--b3);
  border-radius: var(--radius-xl);
  padding: 22px 26px;
  position: relative;
  overflow: hidden;
}
.ltv-banner::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212,170,58,.12) 0%, transparent 70%);
}
.ltv-banner::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--g5), transparent);
  opacity: .4;
}
.ltv-eyebrow {
  font-size: 9px;
  font-weight: 600;
  color: var(--g4);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.ltv-number {
  font-family: var(--serif);
  font-size: 40px;
  font-weight: 700;
  color: var(--g6);
  line-height: 1;
  position: relative;
}
.ltv-number span { font-size: 18px; font-weight: 400; color: var(--g3); }
.ltv-sub2 { font-size: 11px; color: var(--t3); margin-top: 6px; }
.ltv-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 16px; position: relative; }
.ltv-mini {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(212,170,58,.1);
  border-radius: 8px;
  padding: 10px 12px;
}
.ltv-mini-l { font-size: 9.5px; color: var(--t3); margin-bottom: 3px; letter-spacing: .3px; }
.ltv-mini-v { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--t1); }

/* ── SCORE RING ── */
.score-ring { position: relative; flex-shrink: 0; }

/* ── PROFILE AVATAR ── */
.p-avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  flex-shrink: 0;
  border: 2px solid var(--b3);
}

/* ── FUNNEL ── */
.funnel-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 9px;
}
.funnel-label { font-size: 11.5px; color: var(--t2); width: 82px; flex-shrink: 0; }
.funnel-bar {
  height: 22px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  font-size: 11px;
  font-weight: 600;
  transition: width .4s;
}
.funnel-count { font-size: 11.5px; font-weight: 600; color: var(--t2); min-width: 32px; text-align: right; }

/* ── PILL FILTERS ── */
.pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  cursor: pointer;
  border: 1px solid var(--b1);
  background: transparent;
  color: var(--t3);
  font-family: var(--font);
  transition: .2s;
}
.pill:hover { border-color: var(--b3); color: var(--t2); }
.pill.on {
  background: rgba(212,170,58,.12);
  border-color: var(--b4);
  color: var(--g6);
  font-weight: 500;
}

/* ── INNER TABS ── */
.itab-group {
  display: flex;
  gap: 2px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--b1);
  border-radius: 8px;
  padding: 3px;
}
.itab {
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  color: var(--t3);
  transition: .15s;
}
.itab.on { background: rgba(212,170,58,.1); color: var(--g6); font-weight: 500; border: 1px solid var(--b2); }

/* ── UTILS ── */
.mb8 { margin-bottom: 8px; }
.mb12 { margin-bottom: 12px; }
.mb14 { margin-bottom: 14px; }
.mb16 { margin-bottom: 16px; }
.mb20 { margin-bottom: 20px; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-c { align-items: center; }
.j-bw { justify-content: space-between; }
.gap6 { gap: 6px; }
.gap8 { gap: 8px; }
.gap10 { gap: 10px; }
.gap12 { gap: 12px; }
.gap14 { gap: 14px; }
.fw5 { font-weight: 500; }
.fw6 { font-weight: 600; }
.fs10 { font-size: 10px; }
.fs11 { font-size: 11px; }
.fs12 { font-size: 12px; }
.fs13 { font-size: 13px; }
.mono { font-family: var(--mono); }
.tc-t2 { color: var(--t2); }
.tc-t3 { color: var(--t3); }
.tc-g { color: var(--g5); }
.tc-green { color: var(--s-green); }
.tc-red { color: var(--s-red); }
.tc-amber { color: var(--s-amber); }
.tc-blue { color: var(--s-blue); }
.scroll-x { overflow-x: auto; }
.scroll-x::-webkit-scrollbar { height: 3px; }
.scroll-x::-webkit-scrollbar-thumb { background: var(--b3); border-radius: 2px; }
.w100 { width: 100%; }

/* ── ACTION BUTTONS ── */
.act { display: inline-flex; align-items: center; gap: 5px; padding: 5px 13px; border-radius: var(--radius); font-size: 11.5px; font-weight: 500; cursor: pointer; border: 1px solid; font-family: var(--font); transition: .2s; }
.act-p { background: rgba(212,170,58,.12); border-color: var(--b3); color: var(--g6); }
.act-p:hover { background: rgba(212,170,58,.2); box-shadow: 0 0 10px rgba(212,170,58,.1); }
.act-s { background: transparent; border-color: var(--b1); color: var(--t3); }
.act-s:hover { border-color: var(--b2); color: var(--t2); }

/* ── GOLD DIVIDER ── */
.gold-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--b3), transparent); margin: 14px 0; }

/* ── CHART CONTAINER ── */
.ch-wrap { position: relative; }

/* ── ENTRY ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.anim { animation: fadeUp .3s ease both; }
.anim-d1 { animation-delay: .05s; }
.anim-d2 { animation-delay: .1s; }
.anim-d3 { animation-delay: .15s; }
.anim-d4 { animation-delay: .2s; }

/* ── RANK BADGE SPECIAL ── */
.rank-pip {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

textarea {
  font-family: var(--font);
  color: var(--t1);
  border: 1px solid var(--b2);
  border-radius: var(--radius);
  padding: 9px 12px;
  font-size: 12px;
  background: rgba(255,255,255,.03);
  resize: none;
  outline: none;
  width: 100%;
}
textarea:focus { border-color: var(--b4); }
textarea::placeholder { color: var(--t4); }
</style>
</head>
<body>

function drawRing(cvs,score,sz=60){
  if(!cvs)return;
  const ctx=cvs.getContext('2d');
  ctx.clearRect(0,0,sz,sz);
  const r=sz/2-5,cx=sz/2,cy=sz/2;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(212,170,58,.12)';ctx.lineWidth=4;ctx.stroke();
  const p=score/100;
  ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+p*Math.PI*2);
  const col=score>=80?'#d4aa3a':score>=60?'#c8922a':'#d45a4a';
  ctx.strokeStyle=col;ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
  ctx.fillStyle='rgba(224,204,160,.9)';
  ctx.font=`600 ${sz>=56?13:11}px Outfit`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(score,cx,cy);
}

function buildNav(){

    html+=`<div class="sb-item${curTab===t.id?' active':''}" onclick="goto('${t.id}')">
      <svg class="ico" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="${t.d}"/></svg>
      <span>${t.label}</span>
    </div>`;
  });
  document.getElementById('sb-nav').innerHTML=html;
  document.getElementById('tb-title').textContent=TABS.find(t=>t.id===curTab)?.label||'';
}

  curTab=id;
